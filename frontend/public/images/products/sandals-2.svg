<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(110, 170) scale(1.1)">
        <!-- Molded Footbed -->
        <ellipse cx="150" cy="160" rx="130" ry="30" fill="#1A1A1A" stroke="#C6A15B" stroke-width="2"/>
        <ellipse cx="150" cy="157" rx="125" ry="25" fill="#1E1E1E"/>
        <!-- Dual Leather Straps -->
        <path d="M 70 145 C 90 80, 130 80, 150 148" fill="none" stroke="#4A2E18" stroke-width="26" stroke-linecap="round"/>
        <path d="M 160 148 C 180 80, 220 80, 240 152" fill="none" stroke="#4A2E18" stroke-width="26" stroke-linecap="round"/>
        <!-- Metallic Buckles -->
        <rect x="100" y="100" width="16" height="22" rx="3" fill="none" stroke="#C6A15B" stroke-width="3"/>
        <rect x="190" y="100" width="16" height="22" rx="3" fill="none" stroke="#C6A15B" stroke-width="3"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">SANDALS • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">ARTISAN CROSS-STRAP SLIDE</text>
  
  <!-- Gold Badge -->
  
</svg>
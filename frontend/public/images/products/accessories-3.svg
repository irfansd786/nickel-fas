<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(130, 140) scale(1.1)">
        <!-- Leather Wallet / Accessory Frame -->
        <rect x="30" y="50" width="180" height="130" rx="8" fill="#1A1A1A" stroke="#C6A15B" stroke-width="3"/>
        <path d="M 120 50 L 120 180" stroke="#111" stroke-width="4"/>
        <rect x="140" y="90" width="60" height="50" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="1.5"/>
        <circle cx="160" cy="115" r="5" fill="#C6A15B"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">ACCESSORIES • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">EXECUTIVE LEATHER DRESS BELT</text>
  
  <!-- Gold Badge -->
  
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="2" fill="#C6A15B"/>
    <text x="55" y="18" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="900" letter-spacing="1.5" font-family="system-ui, sans-serif">ITALIAN</text>
  </g>
</svg>
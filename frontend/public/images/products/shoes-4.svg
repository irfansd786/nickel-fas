<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(100, 180) scale(1.1)">
        <!-- Sole -->
        <path d="M 30 175 Q 120 185, 270 165 L 270 150 Q 180 160, 30 150 Z" fill="#111" stroke="#C6A15B" stroke-width="1.5"/>
        <rect x="220" y="165" width="45" height="18" rx="2" fill="#000"/>
        <!-- Upper Leather Chelsea/Derby Silhouette -->
        <path d="M 40 150 Q 55 80, 110 60 Q 160 50, 180 105 Q 230 120, 265 150 Z" fill="#6B4226"/>
        <!-- Elastic side panel -->
        <polygon points="120,65 145,65 135,120 110,115" fill="#1A1A1A" stroke="#C6A15B" stroke-width="2"/>
        <path d="M 45 145 Q 140 135, 260 148" fill="none" stroke="#C6A15B" stroke-width="2"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">SHOES • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">SUEDE DOUBLE MONKSTRAP</text>
  
  <!-- Gold Badge -->
  
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="2" fill="#C6A15B"/>
    <text x="55" y="18" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="900" letter-spacing="1.5" font-family="system-ui, sans-serif">NEW</text>
  </g>
</svg>
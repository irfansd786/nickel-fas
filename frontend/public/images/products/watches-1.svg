<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(150, 110) scale(1.1)">
        <!-- Straps -->
        <rect x="80" y="20" width="40" height="90" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="1.5"/>
        <rect x="80" y="210" width="40" height="90" rx="4" fill="#C6A15B" stroke="#C6A15B" stroke-width="1.5"/>
        <!-- Bezel -->
        <circle cx="100" cy="160" r="62" fill="#111" stroke="#C6A15B" stroke-width="6"/>
        <!-- Inner Dial -->
        <circle cx="100" cy="160" r="52" fill="#111111"/>
        <!-- Markers -->
        <line x1="100" y1="114" x2="100" y2="124" stroke="#C6A15B" stroke-width="4"/>
        <line x1="100" y1="196" x2="100" y2="206" stroke="#C6A15B" stroke-width="4"/>
        <line x1="146" y1="160" x2="136" y2="160" stroke="#C6A15B" stroke-width="4"/>
        <line x1="54" y1="160" x2="64" y2="160" stroke="#C6A15B" stroke-width="4"/>
        <!-- Watch Hands -->
        <line x1="100" y1="160" x2="122" y2="138" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="100" y1="160" x2="80" y2="175" stroke="#C6A15B" stroke-width="4" stroke-linecap="round"/>
        <circle cx="100" cy="160" r="4" fill="#C6A15B"/>
        <!-- Subdials -->
        <circle cx="100" cy="140" r="11" fill="none" stroke="rgba(198,161,91,0.5)" stroke-width="1.5"/>
        <circle cx="85" cy="170" r="10" fill="none" stroke="rgba(198,161,91,0.5)" stroke-width="1.5"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">WATCHES • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">CHRONOS MATTE STEEL WATCH</text>
  
  <!-- Gold Badge -->
  
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="2" fill="#C6A15B"/>
    <text x="55" y="18" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="900" letter-spacing="1.5" font-family="system-ui, sans-serif">SWISS MOVT</text>
  </g>
</svg>
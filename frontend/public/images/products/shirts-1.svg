<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(120, 130) scale(1.05)">
        <!-- Shirt Outer Body -->
        <path d="M 65 40 L 35 85 L 65 105 L 65 265 L 235 265 L 235 105 L 265 85 L 235 40 Z" fill="#DBEAFE"/>
        <!-- Collar -->
        <polygon points="110,40 150,75 190,40 170,25 150,30 130,25" fill="#1E40AF" stroke="#C6A15B" stroke-width="1.5"/>
        <!-- Button Placket -->
        <rect x="144" y="70" width="12" height="195" fill="#111"/>
        <circle cx="150" cy="95" r="3.5" fill="#C6A15B"/>
        <circle cx="150" cy="135" r="3.5" fill="#C6A15B"/>
        <circle cx="150" cy="175" r="3.5" fill="#C6A15B"/>
        <circle cx="150" cy="215" r="3.5" fill="#C6A15B"/>
        <!-- Pocket -->
        <rect x="80" y="115" width="35" height="40" rx="1" fill="none" stroke="#1E40AF" stroke-width="2"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">SHIRTS • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">RELAXED FIT OXFORD SHIRT</text>
  
  <!-- Gold Badge -->
  
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="2" fill="#C6A15B"/>
    <text x="55" y="18" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="900" letter-spacing="1.5" font-family="system-ui, sans-serif">ESSENTIAL</text>
  </g>
</svg>
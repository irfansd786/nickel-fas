<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(130, 120) scale(1.05)">
        <!-- Jeans Silhouette -->
        <path d="M 60 30 L 180 30 L 195 270 L 130 270 L 120 110 L 110 110 L 100 270 L 45 270 Z" fill="#1F2937"/>
        <!-- Waistband -->
        <rect x="58" y="30" width="124" height="24" fill="#4B5563" stroke="#C6A15B" stroke-width="1"/>
        <!-- Belt Loops -->
        <rect x="75" y="28" width="6" height="28" fill="#C6A15B"/>
        <rect x="117" y="28" width="6" height="28" fill="#C6A15B"/>
        <rect x="159" y="28" width="6" height="28" fill="#C6A15B"/>
        <!-- Yellow Stitching -->
        <path d="M 60 54 L 180 54" stroke="#C6A15B" stroke-width="2" stroke-dasharray="4 3"/>
        <path d="M 120 54 L 120 110" stroke="#C6A15B" stroke-width="2" stroke-dasharray="4 3"/>
        <path d="M 60 65 Q 90 95, 110 65" stroke="#C6A15B" stroke-width="2" fill="none"/>
        <path d="M 130 65 Q 150 95, 180 65" stroke="#C6A15B" stroke-width="2" fill="none"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">JEANS • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">SLIM-FIT CHARCOAL STRETCH DENIM</text>
  
  <!-- Gold Badge -->
  
</svg>
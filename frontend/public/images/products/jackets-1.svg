<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(198, 161, 91, 0.18)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="230" r="210" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="420" x2="500" y2="420" stroke="rgba(198, 161, 91, 0.1)" stroke-width="1"/>
  
  <!-- Main Illustration Shape -->
  
      <g transform="translate(115, 125) scale(1.05)">
        <!-- Jacket Body -->
        <path d="M 60 40 L 20 90 L 60 110 L 65 265 L 235 265 L 240 110 L 280 90 L 240 40 Z" fill="#0F172A"/>
        <!-- Lapel / Zipper Line -->
        <line x1="150" y1="40" x2="150" y2="265" stroke="#C6A15B" stroke-width="5"/>
        <polygon points="110,40 150,110 190,40" fill="#C6A15B"/>
        <!-- Ribbed Cuffs & Hem -->
        <rect x="65" y="250" width="170" height="15" fill="#111" stroke="#C6A15B" stroke-width="1"/>
        <!-- Pockets -->
        <rect x="80" y="160" width="45" height="40" rx="3" fill="#1A1A1A" stroke="#C6A15B" stroke-width="2"/>
        <rect x="175" y="160" width="45" height="40" rx="3" fill="#1A1A1A" stroke="#C6A15B" stroke-width="2"/>
      </g>
  
  <!-- Watermark Category Text -->
  <text x="250" y="450" text-anchor="middle" fill="#C6A15B" font-size="12" font-weight="900" letter-spacing="4" font-family="system-ui, sans-serif" opacity="0.85">JACKETS • NIKHIL FASHIONS</text>
  <text x="250" y="475" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1" font-family="system-ui, sans-serif">VANGUARD TAILORED BOMBER</text>
  
  <!-- Gold Badge -->
  
  <g transform="translate(30, 30)">
    <rect width="110" height="28" rx="2" fill="#C6A15B"/>
    <text x="55" y="18" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="900" letter-spacing="1.5" font-family="system-ui, sans-serif">BEST SELLER</text>
  </g>
</svg>